name: Nightly safety

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

jobs:
  full-api-and-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowledge_browser_nightly_test
      NATIVE_EVAL_DATABASE_URL: ${{ secrets.NATIVE_EVAL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install -e './api[dev]'
      - name: Full ACL gate
        run: >-
          python -m pytest -q -m full_acl
          --junitxml="${{ runner.temp }}/full-acl.xml" api/tests
      - name: Complete API suite
        run: >-
          python -m pytest -q -m "not full_acl"
          --junitxml="${{ runner.temp }}/full-api.xml" api/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-safety-results
          path: ${{ runner.temp }}/*.xml
