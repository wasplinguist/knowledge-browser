services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_search}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - knowledge_browser_data:/var/lib/postgresql/data

  redwood-db:
    profiles: ["redwood"]
    image: pgvector/pgvector:pg17
    container_name: knowledge-redwood-db
    environment:
      POSTGRES_DB: knowledge_redwood
      POSTGRES_PASSWORD: ${REDWOOD_POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${REDWOOD_POSTGRES_USER:-postgres}
    ports:
      - "127.0.0.1:${REDWOOD_POSTGRES_PORT:-5433}:5432"
    volumes:
      - knowledge_redwood_data:/var/lib/postgresql/data

volumes:
  knowledge_browser_data:
  knowledge_redwood_data:
    name: knowledge_redwood_data
